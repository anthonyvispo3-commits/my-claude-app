<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OYV Replan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --paper: #FFFFFF;
    --card: #FFFFFF;
    --sunk: #F6F2FF;
    --ink: #0A0A0C;
    --graphite: #5A5866;
    --faint: #8A8794;
    --rule: #E7E3EE;
    --rule-strong: #D3CCE0;
    --marker: #8F00FF;
    --marker-deep: #8F00FF;
    --warn: #C2185B;
    --cat-work: #8F00FF;
    --cat-leisure: #C2185B;
    --cat-transport: #2B7F79;
    --cat-health: #4E8A1F;
    --cat-meeting: #0A0A0C;
    --cat-rest: #8A8794;
    --cat-medical: #D2333F;
    --cat-hobby: #B7791F;
    --shadow: 0 1px 2px rgba(10,10,12,.04), 0 6px 24px -14px rgba(10,10,12,.18);
    --radius: 12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #000000;
      --card: #0E0D12;
      --sunk: #17141F;
      --ink: #FFFFFF;
      --graphite: #A39FB0;
      --faint: #7A7686;
      --rule: #25212E;
      --rule-strong: #352F42;
      --marker: #A43DFF;
      --marker-deep: #B56BFF;
      --warn: #FF5C93;
      --cat-work: #B56BFF;
      --cat-leisure: #FF6FA8;
      --cat-transport: #5FBDB5;
      --cat-health: #8FCB5A;
      --cat-meeting: #FFFFFF;
      --cat-rest: #A39FB0;
      --cat-medical: #FF6B75;
      --cat-hobby: #E2B04A;
      --shadow: 0 1px 2px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #000000;
    --card: #0E0D12;
    --sunk: #17141F;
    --ink: #FFFFFF;
    --graphite: #A39FB0;
    --faint: #7A7686;
    --rule: #25212E;
    --rule-strong: #352F42;
    --marker: #A43DFF;
    --marker-deep: #B56BFF;
    --warn: #FF5C93;
    --cat-work: #B56BFF;
    --cat-leisure: #FF6FA8;
    --cat-transport: #5FBDB5;
    --cat-health: #8FCB5A;
    --cat-meeting: #FFFFFF;
    --cat-rest: #A39FB0;
    --cat-medical: #FF6B75;
    --cat-hobby: #E2B04A;
    --shadow: 0 1px 2px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 28px 64px;
  }

  /* ---------- masthead ---------- */
  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px 24px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--rule-strong);
  }
  .brand { display: flex; gap: 12px; flex-wrap: wrap; }
  .brand h1 {
    font-family: "Anton", "Inter", sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 5vw, 44px);
    letter-spacing: -0.03em;
    line-height: 1;
    margin: 0;
  }
  .brand h1 em {
    font-style: normal;
    background: linear-gradient(to top, color-mix(in oklab, var(--marker) 70%, transparent) 42%, transparent 42%);
    padding-inline: 2px;
  }
  .brand p {
    margin: 0;
    color: var(--graphite);
    font-size: 14px;
    max-width: 34ch;
  }
  .rightside { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brand { flex-direction: column; align-items: flex-start; gap: 8px; }
  .brand h1 { line-height: 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .brand h1 .appname { font-family: "Anton", "Inter", sans-serif; font-weight: 400; font-size: clamp(26px, 5vw, 40px); line-height: 1; letter-spacing: .02em; text-transform: uppercase; color: var(--marker); }
  .brand h1 img { height: clamp(28px, 5.6vw, 44px); width: auto; display: block; max-width: 100%; }
  .brand h1 .logo-dark { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .brand h1 .logo-light { display: none; }
    :root:not([data-theme="light"]) .brand h1 .logo-dark { display: block; }
  }
  :root[data-theme="dark"] .brand h1 .logo-light { display: none; }
  :root[data-theme="dark"] .brand h1 .logo-dark { display: block; }
  .stream {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--ink); color: var(--paper);
    border: 1px solid var(--ink); border-radius: 999px;
    padding: 7px 14px 7px 8px;
    font-family: "Anton", "Inter", sans-serif; font-size: 15px; letter-spacing: .04em; text-transform: uppercase;
    text-decoration: none; white-space: nowrap;
    transition: background-color .15s ease, transform .08s ease;
  }
  .stream:hover { background: var(--marker); border-color: var(--marker); color: #fff; }
  .stream:active { transform: translateY(1px); }
  .stream { padding: 6px 16px 6px 10px; font-size: 16px; }
  .stream .mono-forwhite { display: none; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .stream .mono-forblack { display: none; }
    :root:not([data-theme="light"]) .stream .mono-forwhite { display: block; }
  }
  :root[data-theme="dark"] .stream .mono-forblack { display: none; }
  :root[data-theme="dark"] .stream .mono-forwhite { display: block; }
  .stream:hover .mono-forwhite, .stream[aria-expanded="true"] .mono-forwhite { display: none !important; }
  .stream:hover .mono-forblack, .stream[aria-expanded="true"] .mono-forblack { display: block !important; }
  .stream .mono { height: 22px; width: auto; }
  .stream .mono-forblack { display: block; }
  .stream[aria-expanded="true"] { background: var(--marker); border-color: var(--marker); color: #fff; }
  #oyvplayer {
    position: fixed; right: 18px; bottom: 18px; z-index: 40;
    width: min(380px, calc(100vw - 24px));
    background: var(--card); border: 1px solid var(--rule-strong); border-radius: 16px;
    box-shadow: 0 18px 50px -18px rgba(0,0,0,.45);
    overflow: hidden;
    transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .2s ease;
  }
  #oyvplayer.off { transform: translateY(calc(100% + 40px)); opacity: 0; pointer-events: none; }
  #oyvplayer.mini .pl-body { height: 0; }
  #oyvplayer .pl-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--rule); }
  #oyvplayer .pl-head img { height: 18px; width: auto; }
  #oyvplayer .pl-title { font-family: "Anton", "Inter", sans-serif; text-transform: uppercase; letter-spacing: .04em; font-size: 15px; flex: 1 1 auto; }
  #oyvplayer .pl-head button, #oyvplayer .pl-head a {
    background: transparent; border: 1px solid var(--rule-strong); color: var(--graphite);
    font-size: 12px; padding: 4px 9px; border-radius: 999px; text-decoration: none; white-space: nowrap; font-family: "Inter", sans-serif;
  }
  #oyvplayer .pl-head button:hover, #oyvplayer .pl-head a:hover { color: var(--ink); border-color: var(--ink); }
  #oyvplayer .pl-body { height: 352px; transition: height .25s ease; overflow: hidden; background: #0A0A0C; }
  #oyvplayer iframe { display: block; width: 100%; height: 352px; border: 0; background: transparent; color-scheme: normal; border-radius: 12px; }
  #oyvplayer { background: #0A0A0C; border-color: #25212E; color: #FFFFFF; }
  #oyvplayer .pl-head { border-bottom-color: #25212E; }
  #oyvplayer .pl-head button, #oyvplayer .pl-head a { color: #A39FB0; border-color: #352F42; }
  #oyvplayer .pl-head button:hover, #oyvplayer .pl-head a:hover { color: #FFFFFF; border-color: #FFFFFF; }
  #oyvplayer .pl-body { padding: 0 8px 8px; box-sizing: content-box; }
  #oyvplayer.mini .pl-body { padding: 0; }
  @media (max-width: 560px) {
    #oyvplayer { right: 12px; left: 12px; width: auto; bottom: 12px; }
    #oyvplayer .pl-body, #oyvplayer iframe { height: 152px; }
  }
  .stream .disc { width: 24px; height: 24px; border-radius: 50%; background: var(--marker); display: grid; place-items: center; flex: none; }
  .stream:hover .disc { background: #fff; }
  .stream:hover .disc svg { fill: var(--marker); }
  .stream .disc svg { width: 10px; height: 10px; fill: #fff; margin-left: 2px; }
  .clockbox {
    font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    color: var(--graphite);
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .clockbox .now { color: var(--ink); font-size: 20px; font-weight: 500; display: block; }

  .langswitch {
    display: inline-flex;
    border: 1px solid var(--rule-strong);
    border-radius: 999px;
    overflow: hidden;
    background: var(--card);
  }
  .langswitch button {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: .08em;
    padding: 6px 10px;
    background: transparent;
    color: var(--graphite);
    border: 0;
    border-radius: 0;
  }
  .langswitch button[aria-pressed="true"] {
    background: var(--ink);
    color: var(--paper);
  }
  .langswitch button:not([aria-pressed="true"]):hover { color: var(--ink); background: var(--sunk); }

  /* ---------- layout ---------- */
  .cols {
    display: grid;
    grid-template-columns: minmax(0, 340px) minmax(0, 1fr);
    gap: 28px;
    align-items: start;
    margin-top: 26px;
  }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; gap: 22px; } }
  @media (max-width: 560px) {
    .clockbox { text-align: left; }
    .rightside { width: 100%; justify-content: space-between; }
    .block { left: 48px; right: 8px; }
    .block .src { display: none; }
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0;
  }

  textarea#braindump {
    width: 100%;
    min-height: 150px;
    resize: vertical;
    background: var(--sunk);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 12px;
    font: inherit;
    line-height: 1.6;
  }
  textarea#braindump::placeholder { color: var(--faint); }

  .hint { margin: 0; font-size: 12.5px; color: var(--graphite); }
  .hint code {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11.5px;
    background: var(--sunk);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 1px 4px;
  }

  button {
    font: inherit;
    cursor: pointer;
    border-radius: 4px;
    border: 1px solid transparent;
    transition: transform .08s ease, background-color .15s ease, border-color .15s ease;
  }
  button:active { transform: translateY(1px); }
  :focus-visible { outline: 2px solid var(--marker-deep); outline-offset: 2px; }

  .btn-primary {
    background: var(--marker);
    color: #FFFFFF;
    font-weight: 700;
    padding: 12px 16px;
    border-color: var(--marker);
    border-radius: 10px;
    letter-spacing: .01em;
  }
  .btn-primary:hover { background: color-mix(in oklab, var(--marker) 82%, #000); border-color: color-mix(in oklab, var(--marker) 82%, #000); }
  .btn-primary[disabled] { opacity: .55; cursor: progress; }
  .btn-ghost {
    background: transparent;
    color: var(--ink);
    border-color: var(--rule-strong);
    padding: 8px 12px;
    font-weight: 500;
    font-size: 14px;
  }
  .btn-ghost:hover { border-color: var(--ink); background: var(--sunk); }

  .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10.5px;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .field input, .field select {
    font: inherit;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 13px;
    background: var(--sunk);
    color: var(--ink);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 7px 8px;
  }
  .toggles { display: flex; flex-direction: column; gap: 8px; }
  .toggle { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--graphite); }
  .toggle input { accent-color: var(--marker-deep); width: 15px; height: 15px; }

  .divider { height: 1px; background: var(--rule); }

  /* ---------- schedule ---------- */
  .sched-head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .sched-head h2 {
    font-family: "Anton", "Inter", sans-serif;
    font-size: 22px;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0;
    font-weight: 400;
  }
  .stats {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    color: var(--graphite);
    font-variant-numeric: tabular-nums;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 10px;
  }
  .stats b { color: var(--ink); font-weight: 500; }

  .ruler {
    position: relative;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    padding-block: 14px;
  }
  .ruler-inner { position: relative; }
  .hourline {
    position: absolute;
    left: 0; right: 0;
    border-top: 1px solid var(--rule);
    pointer-events: none;
  }
  .hourline.half { border-top-style: dotted; opacity: .7; }
  .hourlabel {
    position: absolute;
    left: 8px;
    transform: translateY(-50%);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--faint);
    font-variant-numeric: tabular-nums;
    pointer-events: none;
  }
  .nowline {
    position: absolute;
    left: 0; right: 0;
    height: 0;
    border-top: 2px solid var(--marker-deep);
    z-index: 4;
    pointer-events: none;
  }
  .nowline span {
    position: absolute;
    left: 4px;
    top: -9px;
    background: var(--marker);
    color: #FFFFFF;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    font-variant-numeric: tabular-nums;
  }

  .block {
    position: absolute;
    left: 56px;
    right: 10px;
    background: color-mix(in oklab, var(--cat) 11%, var(--card));
    border: 1px solid color-mix(in oklab, var(--cat) 34%, var(--card));
    border-left: 3px solid var(--cat);
    border-radius: 4px;
    padding: 6px 8px 6px 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 2px;
    z-index: 2;
  }
  .block.tiny { padding-block: 3px; justify-content: center; }
  .block.tiny .b-top { justify-content: flex-start; gap: 8px; align-items: center; }
  .block.tiny .b-title { flex: 1 1 auto; min-width: 0; }
  .block.tiny .b-time { flex: none; }
  .block.tiny .icon { height: 18px; }
  .block .b-top { display: flex; align-items: baseline; gap: 8px; justify-content: space-between; }
  .block .b-title {
    font-weight: 600;
    font-size: 14px;
    line-height: 1.25;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .block .b-time {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--graphite);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .block .b-meta { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; overflow: hidden; }
  .tag {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--cat);
    border: 1px solid color-mix(in oklab, var(--cat) 40%, transparent);
    border-radius: 3px;
    padding: 0 4px;
    white-space: nowrap;
  }
  .src {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 10px;
    color: var(--faint);
    white-space: nowrap;
  }
  .block .b-acts { display: flex; gap: 4px; margin-left: auto; }
  .icon {
    background: transparent;
    border: 1px solid var(--rule-strong);
    color: var(--graphite);
    width: 22px; height: 20px;
    line-height: 1;
    font-size: 12px;
    display: grid;
    place-items: center;
    padding: 0;
  }
  .icon:hover { color: var(--ink); border-color: var(--ink); }
  .block.done { opacity: .5; }
  .block.done .b-title { text-decoration: line-through; }
  .block.locked { border-style: dashed; }
  .block.moved { box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--warn) 45%, transparent); }

  .empty-note {
    padding: 40px 20px;
    text-align: center;
    color: var(--faint);
    font-size: 14px;
  }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; }
  .toolbar .grow { flex: 1 1 auto; }

  .overflow {
    margin-top: 18px;
    border: 1px dashed var(--rule-strong);
    border-radius: var(--radius);
    padding: 14px;
    background: color-mix(in oklab, var(--warn) 7%, var(--card));
  }
  .overflow h3 {
    margin: 0 0 8px;
    font-family: "Anton", "Inter", sans-serif;
    font-size: 14px;
    letter-spacing: -0.01em;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--card);
    border: 1px solid var(--rule-strong);
    border-radius: 999px;
    padding: 4px 5px 4px 11px;
    font-size: 13px;
  }
  .chip .mins {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    color: var(--graphite);
  }

  .banner {
    font-size: 12.5px;
    color: var(--graphite);
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--marker-deep); flex: none; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    margin-top: 16px;
    font-size: 12px;
    color: var(--graphite);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  footer.note {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    font-size: 12.5px;
    color: var(--faint);
    max-width: 70ch;
  }

  .dayswitch {
    display: flex;
    border: 1px solid var(--rule-strong);
    border-radius: 5px;
    overflow: hidden;
  }
  .dayswitch button {
    flex: 1 1 50%;
    background: transparent;
    color: var(--graphite);
    border: 0;
    border-radius: 0;
    padding: 9px 10px;
    font-size: 14px;
    font-weight: 500;
  }
  .dayswitch button + button { border-left: 1px solid var(--rule-strong); }
  .dayswitch button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .dayswitch button:not([aria-pressed="true"]):hover { background: var(--sunk); color: var(--ink); }

  /* ---------- alerts ---------- */
  .alertrow { display: flex; gap: 8px; align-items: flex-end; }
  .alertrow .field { flex: 1 1 auto; }
  .btn-mini {
    background: transparent;
    border: 1px solid var(--rule-strong);
    color: var(--graphite);
    padding: 7px 10px;
    font-size: 13px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }
  .btn-mini:hover { color: var(--ink); border-color: var(--ink); }

  #alarmbanner {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%) translateY(140%);
    z-index: 50;
    width: min(420px, calc(100vw - 32px));
    background: var(--ink);
    color: var(--paper);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 12px 40px -12px rgba(0,0,0,.55);
    transition: transform .3s cubic-bezier(.2,.8,.2,1);
  }

    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--marker);
  }

    font-weight: 600;
    font-size: 16px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

  #alarmbanner .ab-time {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12px;
    opacity: .75;
  }

    border: 1px solid rgba(247,246,240,.35);
    color: var(--paper);
    padding: 6px 10px;
    font-size: 13px;
    flex: none;
  }
  #alarmbanner button:hover { border-color: var(--paper); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  /* ---------------- scheduling ---------------- */
  function round5(n) { return Math.ceil(n / 5) * 5; }

  function findSlot(from, length, occupied, endMin) {
    var cand = round5(Math.max(from, 0));
    var sorted = occupied.slice().sort(function (a, b) { return a[0] - b[0]; });
    for (var i = 0; i < sorted.length; i++) {
      var os = sorted[i][0], oe = sorted[i][1];
      if (cand + length <= os) break;
      if (oe > cand) cand = round5(oe);
    }
    return cand + length <= endMin ? cand : null;
  }

  function schedule(fromMin) {
    var occupied = [], i;
    if (state.protectLunch) occupied.push([state.lunchMin, state.lunchMin + state.lunchLen]);

    var anchors = state.tasks.filter(function (x) { return x.fixed !== null; })
      .sort(function (a, b) { return a.fixed - b.fixed; });
    anchors.forEach(function (x) {
      x.start = x.fixed;
      occupied.push([x.start, x.start + x.minutes]);
    });

    var flex = state.tasks.filter(function (x) { return x.fixed === null; });
    if (state.deepFirst) {
      var score = function (x) {
        return x.focus === "deep" ? 0 : (CAT_ORDER.indexOf(x.cat) + 1 || 1);
      };
      flex = flex.map(function (x, idx) { return { t: x, idx: idx }; })
        .sort(function (a, b) {
          var d = score(a.t) - score(b.t);
          return d !== 0 ? d : a.idx - b.idx;
        })
        .map(function (o) { return o.t; });
    }

    var cursor = Math.max(state.startMin, fromMin == null ? state.startMin : fromMin);
    var overflow = [];
    for (i = 0; i < flex.length; i++) {
      var task = flex[i];
      var slot = findSlot(cursor, task.minutes, occupied, state.endMin);
      if (slot === null) { task.start = null; overflow.push(task); continue; }
      task.start = slot;
      occupied.push([slot, slot + task.minutes]);
      cursor = slot + task.minutes + state.buffer;
    }
    return overflow;
  }

  function replanFromNow() {
    // Only today can be replanned "from now", and only while there is still
    // day left to replan into. Without this, opening the app at 22:00 pushed
    // every block past the end of the window and the plan emptied itself.
    if (!isToday()) return;
    if (nowMin() >= state.endMin) {
      savedNote = t("replan_late");
      el.saved.textContent = savedNote;
      savedNote = "";
      return;
    }
    var cut = round5(nowMin());
    state.tasks.forEach(function (x) {
      if (x.done) return;
      var end = (x.start === null ? null : x.start + x.minutes);
      if (end !== null && end <= cut) {
        x.fixed = null;
        x.pinned = false;
        x.moved = true;
      }
    });
    state.from = cut;
    render(cut);
    save();
  }

  /* ---------------- rendering ---------------- */
  var PX_PER_MIN = 1.5;
  function pxPerMin() { return window.innerWidth < 620 ? 1.25 : PX_PER_MIN; }

  function render(fromMin) {
    if (fromMin == null) fromMin = state.from;
    var overflow = schedule(fromMin);
    var scale = pxPerMin();
    var latest = state.endMin;
    state.tasks.forEach(function (x) {
      if (x.start !== null) latest = Math.max(latest, x.start + x.minutes);
    });
    if (state.protectLunch) latest = Math.max(latest, state.lunchMin + state.lunchLen);
    var span = Math.max(60, latest - state.startMin);
    var freeSpan = Math.max(60, state.endMin - state.startMin);
    var r = el.ruler;
    r.innerHTML = "";
    r.style.height = (span * scale) + "px";

    if (!state.tasks.length) {
      r.style.height = "auto";
      r.innerHTML = '<div class="empty-note">' + t("empty") + "</div>";
      el.stats.textContent = "";
      el.overflow.hidden = true;
      renderLegend([]);
      return;
    }

    var h0 = Math.floor(state.startMin / 60) * 60;
    for (var m = h0; m <= state.startMin + span; m += 30) {
      if (m < state.startMin) continue;
      var y = (m - state.startMin) * scale;
      var line = document.createElement("div");
      line.className = "hourline" + (m % 60 ? " half" : "");
      line.style.top = y + "px";
      r.appendChild(line);
      if (m % 60 === 0) {
        var lab = document.createElement("div");
        lab.className = "hourlabel";
        lab.style.top = y + "px";
        lab.textContent = hhmm(m);
        r.appendChild(lab);
      }
    }

    if (state.protectLunch) {
      var lb = document.createElement("div");
      lb.className = "block tiny";
      lb.style.setProperty("--cat", "var(--cat-rest)");
      lb.style.top = ((state.lunchMin - state.startMin) * scale) + "px";
      lb.style.height = (state.lunchLen * scale - 3) + "px";
      lb.style.opacity = ".75";
      lb.innerHTML = '<div class="b-top"><span class="b-title">' + t("lunch") + '</span><span class="b-time">' +
        hhmm(state.lunchMin) + "–" + hhmm(state.lunchMin + state.lunchLen) + "</span></div>";
      r.appendChild(lb);
    }

    var used = 0, cats = {};
    state.tasks.forEach(function (x) {
      if (x.start === null) return;
      used += x.minutes;
      cats[x.cat] = true;
      r.appendChild(blockEl(x, scale));
    });

    if (state.date === todayKey()) {
      var n = nowMin();
      if (n >= state.startMin && n <= state.endMin) {
        var nl = document.createElement("div");
        nl.className = "nowline";
        nl.style.top = ((n - state.startMin) * scale) + "px";
        nl.innerHTML = "<span>" + t("now") + " " + hhmm(n) + "</span>";
        r.appendChild(nl);
      }
    }

    var planned = state.tasks.filter(function (x) { return x.start !== null; }).length;
    var freeMin = Math.max(0, freeSpan - used - (state.protectLunch ? state.lunchLen : 0));
    el.stats.innerHTML =
      "<span><b>" + planned + "</b> " + t("s_blocks") + "</span>" +
      "<span><b>" + dur(used) + "</b> " + t("s_planned") + "</span>" +
      "<span><b>" + dur(freeMin) + "</b> " + t("s_free") + "</span>" +
      (overflow.length ? '<span style="color:var(--warn)"><b>' + overflow.length + "</b> " + t("s_nofit") + "</span>" : "");

    el.overflow.hidden = overflow.length === 0;
    el.overflowChips.innerHTML = "";
    overflow.forEach(function (x) {
      var c = document.createElement("span");
      c.className = "chip";
      c.innerHTML = "<span>" + esc(x.title) + '</span><span class="mins">' + dur(x.minutes) + "</span>";
      c.appendChild(iconBtn("✕", fill(t("a_remove"), x.title), function () { removeTask(x.id); }));
      el.overflowChips.appendChild(c);
    });

    renderLegend(Object.keys(cats));
  }

  function blockEl(x, scale) {
    var d = document.createElement("div");
    d.className = "block" + (x.done ? " done" : "") + (x.pinned ? " locked" : "") + (x.moved ? " moved" : "");
    var h = x.minutes * scale - 3;
    var metaMin = 48;
    if (h < metaMin) d.className += " tiny";
    d.style.setProperty("--cat", "var(" + CAT_VARS[x.cat] + ")");
    d.style.top = ((x.start - state.startMin) * scale) + "px";
    d.style.height = Math.max(20, h) + "px";

    var top = document.createElement("div");
    top.className = "b-top";
    top.innerHTML = '<span class="b-title">' + esc(x.title) + "</span>" +
      '<span class="b-time">' + hhmm(x.start) + "–" + hhmm(x.start + x.minutes) + "</span>";
    d.appendChild(top);

    if (h >= metaMin) {
      var meta = document.createElement("div");
      meta.className = "b-meta";
      var srcLabel = x.source === "you" ? t("src_you") : x.source === "ai" ? t("src_ai") : t("src_rule");
      meta.innerHTML = '<span class="tag">' + t("cat_" + x.cat) + "</span>" +
        '<span class="src">' + dur(x.minutes) + " · " + srcLabel + (x.pinned ? " · " + t("pinned") : "") + "</span>";
      var acts = document.createElement("div");
      acts.className = "b-acts";
      acts.appendChild(iconBtn("−15", fill(t("a_shorten"), x.title), function () { nudge(x.id, -15); }));
      acts.appendChild(iconBtn("+15", fill(t("a_lengthen"), x.title), function () { nudge(x.id, 15); }));
      acts.appendChild(iconBtn(x.done ? "↺" : "✓", fill(x.done ? t("a_reopen") : t("a_done"), x.title), function () { toggleDone(x.id); }));
      acts.appendChild(iconBtn("✕", fill(t("a_remove"), x.title), function () { removeTask(x.id); }));
      meta.appendChild(acts);
      d.appendChild(meta);
    } else {
      var mini = document.createElement("div");
      mini.className = "b-acts";
      mini.appendChild(iconBtn(x.done ? "↺" : "✓", fill(x.done ? t("a_reopen") : t("a_done"), x.title), function () { toggleDone(x.id); }));
      mini.appendChild(iconBtn("✕", fill(t("a_remove"), x.title), function () { removeTask(x.id); }));
      top.appendChild(mini);
    }
    return d;
  }

  function iconBtn(label, aria, fn) {
    var b = document.createElement("button");
    b.className = "icon";
    b.type = "button";
    b.textContent = label;
    b.title = aria;
    b.setAttribute("aria-label", aria);
    if (label === "−15" || label === "+15") b.style.width = "30px";
    b.onclick = fn;
    return b;
  }

  function renderLegend(keys) {
    el.legend.innerHTML = "";
    keys.forEach(function (k) {
      var s = document.createElement("span");
      s.innerHTML = '<i style="background:var(' + CAT_VARS[k] + ')"></i>' + t("cat_" + k);
      el.legend.appendChild(s);
    });
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  /* ---------------- mutations ---------------- */
  function byId(id) {
    for (var i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === id) return state.tasks[i];
    return null;
  }
  function nudge(id, delta) {
    var x = byId(id);
    if (!x) return;
    x.minutes = Math.max(15, Math.min(240, x.minutes + delta));
    x.source = "you";
    render(); save();
  }
  function toggleDone(id) {
    var x = byId(id);
    if (!x) return;
    x.done = !x.done;
    if (x.done && x.start !== null) { x.fixed = x.start; x.pinned = true; x.moved = false; }
    else if (!x.done) { x.fixed = x.wasPinned ? x.origFixed : null; x.pinned = !!x.wasPinned; }
    render(); save();
  }
  function removeTask(id) {
    state.tasks = state.tasks.filter(function (x) { return x.id !== id; });
    state.text = state.tasks.map(taskToLine).join("\n");
    el.braindump.value = state.text;
    render(); save();
  }
  function taskToLine(x) {
    var cue = lang === "it" ? " alle " : " at ";
    return x.title +
      (x.source === "you" ? " " + x.minutes + "m" : "") +
      (x.wasPinned && x.origFixed !== null ? cue + hhmm(x.origFixed) : "");
  }

  /* ---------------- settings ---------------- */
  function readSettings() {
    var s = parseHHMM(el.start.value), e = parseHHMM(el.end.value), l = parseHHMM(el.lunch.value);
    if (s !== null) state.startMin = s;
    if (e !== null) state.endMin = e;
    if (l !== null) state.lunchMin = l;
    if (state.endMin <= state.startMin) state.endMin = state.startMin + 60;
    state.buffer = parseInt(el.buffer.value, 10) || 0;
    state.protectLunch = el.protectLunch.checked;
    state.deepFirst = el.deepFirst.checked;
    state.alerts = el.alerts.checked;
    state.sound = el.sound.checked;
    state.ring = el.ring.checked;
    state.lead = parseInt(el.lead.value, 10) || 0;
    state.autoReplan = parseInt(el.autoReplan.value, 10) || 0;
  }
  function writeSettings() {
    el.start.value = hhmm(state.startMin);
    el.end.value = hhmm(state.endMin);
    el.lunch.value = hhmm(state.lunchMin);
    el.buffer.value = String(state.buffer);
    el.protectLunch.checked = state.protectLunch;
    el.deepFirst.checked = state.deepFirst;
    el.alerts.checked = state.alerts;
    el.sound.checked = state.sound;
    el.ring.checked = state.ring;
    el.lead.value = String(state.lead);
    el.autoReplan.value = String(state.autoReplan);
  }

  /* ---------------- language ---------------- */
  function applyLanguage() {
    document.documentElement.lang = lang;
    var nodes = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < nodes.length; i++) nodes[i].textContent = t(nodes[i].getAttribute("data-i18n"));
    el.hint.innerHTML = t("hint");
    el.braindump.placeholder = t("placeholder");
    el.braindump.setAttribute("aria-label", t("textareaLabel"));
    el.plan.textContent = planning ? t("planning") : t("plan");
    el.replan.textContent = t("replan");
    el.clear.textContent = t("clear");
    el.buffer.options[0].textContent = t("buffer_none");
    el.lead.options[0].textContent = t("lead_0");
    el.lead.options[1].textContent = t("lead_5");
    el.lead.options[2].textContent = t("lead_10");
    [0, 1, 5, 10, 30, 60].forEach(function (v, i) {
      el.autoReplan.options[i].textContent = t("auto_" + v);
    });
    el.testAlert.textContent = t("test");
    var st = document.getElementById("oyvstream");
    if (st) { st.title = t("stream_title"); }
    var pm = document.getElementById("plMin"), pc = document.getElementById("plClose"), po = document.getElementById("plOpen");
    if (pm) { var mini = document.getElementById("oyvplayer").classList.contains("mini"); pm.title = mini ? t("pl_max") : t("pl_min"); pm.setAttribute("aria-label", pm.title); }
    if (pc) { pc.title = t("pl_close"); pc.setAttribute("aria-label", pc.title); }
    if (po) { po.title = t("pl_open"); }
    el.abSnooze.textContent = t("ab_snooze");
    el["day-0"].textContent = t("day_today");
    el["day-1"].textContent = t("day_tomorrow");
    el["day-0"].setAttribute("aria-pressed", String(!state.dayOffset));
    el["day-1"].setAttribute("aria-pressed", String(!!state.dayOffset));
    el.schedhead.textContent = state.dayOffset ? t("todayblocks_t") : t("todayblocks");
    el.ics.textContent = t("ics");
    el.abClose.textContent = t("ab_close");
    el.alertsHint.textContent = state.dayOffset
      ? t("tomorrow_hint")
      : t("alerts_hint") +
        (state.ring ? " " + t("ring_hint") : "") +
        (state.autoReplan ? " " + t("auto_hint") : "");
    el.engine.textContent = sample ? t("engine_ai") : t("engine_rules");
    el["lang-en"].setAttribute("aria-pressed", String(lang === "en"));
    el["lang-it"].setAttribute("aria-pressed", String(lang === "it"));
    tick();
  }

  function setLanguage(next, opts) {
    if (!I18N[next] || next === lang) return;
    var wasExample = state.isExample;
    lang = next;
    try { localStorage.setItem("replan:lang", lang); } catch (e) {}
    applyLanguage();
    // An untouched example day switches language with the interface.
    if (wasExample && state.tasks.length && (!opts || opts.reseed !== false)) {
      state.text = t("example");
      el.braindump.value = state.text;
      state.tasks = parseLines(state.text);
      state.isExample = true;
      el.saved.textContent = t("saved_example");
    }
    render();
  }

  /* ---------------- which day ---------------- */
  function readLocalDay(key) {
    try { return JSON.parse(localStorage.getItem("replan:" + key) || "null"); } catch (e) { return null; }
  }

  function blankDay(key) {
    state.date = key;
    state.text = "";
    state.tasks = [];
    state.from = null;
    state.isExample = false;
  }

  function setDay(offset) {
    offset = offset ? 1 : 0;
    if (offset === state.dayOffset) return;
    clearTimeout(saveTimer);
    if (state.tasks.length || state.text) persist();   // keep the day we are leaving
    state.dayOffset = offset;
    firedKeys = {};
    snoozes = [];
    hideBanner();
    var key = dateKey(offset);
    var saved = readLocalDay(key);
    if (saved && applySnapshot(saved)) {
      state.date = key;
    } else {
      blankDay(key);
    }
    state.dayOffset = offset;
    writeSettings();
    el.braindump.value = state.text;
    applyLanguage();
    render();
    el.saved.textContent = "";
    if (offset && db) {
      db.doc("days/" + key).get().then(function (snap) {
        var data = snap && snap.exists ? snap.data() : null;
        if (data && state.dayOffset === offset && applySnapshot(data)) {
          state.date = key;
          writeSettings();
          el.braindump.value = state.text;
          render();
          el.saved.textContent = t("restored_account");
        }
      }).catch(function () {});
    }
  }

  /* ---------------- persistence ---------------- */
  function snapshot() {
    return {
      date: state.date, text: state.text, lang: lang, dayOffset: state.dayOffset,
      startMin: state.startMin, endMin: state.endMin,
      buffer: state.buffer, lunchMin: state.lunchMin, protectLunch: state.protectLunch,
      deepFirst: state.deepFirst, isExample: state.isExample,
      alerts: state.alerts, sound: state.sound, ring: state.ring,
      lead: state.lead, autoReplan: state.autoReplan, from: state.from,
      tasks: state.tasks.map(function (x) {
        return { id: x.id, title: x.title, minutes: x.minutes, source: x.source, cat: x.cat, focus: x.focus,
                 fixed: x.fixed, pinned: x.pinned, wasPinned: !!x.wasPinned,
                 origFixed: (typeof x.origFixed === "number" ? x.origFixed : null),
                 done: x.done, moved: x.moved };
      })
    };
  }
  function applySnapshot(o) {
    if (!o || !o.tasks) return false;
    state.date = o.date || todayKey();
    state.text = o.text || "";
    if (typeof o.startMin === "number") state.startMin = o.startMin;
    if (typeof o.endMin === "number") state.endMin = o.endMin;
    if (typeof o.buffer === "number") state.buffer = o.buffer;
    if (typeof o.lunchMin === "number") state.lunchMin = o.lunchMin;
    state.protectLunch = o.protectLunch !== false;
    state.deepFirst = o.deepFirst !== false;
    state.alerts = !!o.alerts;
    state.sound = o.sound !== false;
    state.ring = !!o.ring;
    if (typeof o.lead === "number") state.lead = o.lead;
    if (typeof o.autoReplan === "number") state.autoReplan = o.autoReplan;
    state.from = (typeof o.from === "number") ? o.from : null;
    state.isExample = !!o.isExample;
    state.tasks = o.tasks.map(function (x) {
      return { id: x.id, title: x.title, minutes: x.minutes, source: x.source || "rule",
               cat: catOf(x.cat), focus: x.focus === "deep" ? "deep" : "shallow",
               fixed: (typeof x.fixed === "number" ? x.fixed : null),
               pinned: !!x.pinned, wasPinned: !!x.wasPinned,
               origFixed: (typeof x.origFixed === "number" ? x.origFixed : null),
               done: !!x.done, moved: !!x.moved, start: null };
    });
    return true;
  }
  function persist() {
    var data = snapshot();
    try { localStorage.setItem("replan:" + state.date, JSON.stringify(data)); } catch (e) {}
    if (db) db.doc("days/" + state.date).set(data).catch(function () {});
  }

  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      var data = snapshot();
      try { localStorage.setItem("replan:" + state.date, JSON.stringify(data)); } catch (e) {}
      if (db) {
        db.doc("days/" + state.date).set(data).then(function () {
          el.saved.textContent = fill(t("saved_at"), hhmm(nowMin()));
        }, function () { el.saved.textContent = t("saved_devonly"); });
      } else {
        el.saved.textContent = t("saved_device");
      }
      if (savedNote) { el.saved.textContent = savedNote; savedNote = ""; }
      nativeSchedule();
    }, 400);
  }

  /* ---------------- estimation ---------------- */
  function estimate(tasks) {
    var need = tasks.filter(function (x) { return x.source !== "you"; });
    if (!sample || !need.length) return Promise.resolve(false);
    var list = need.map(function (x, i) { return (i + 1) + ". " + x.title; }).join("\n");
    var prompt =
      "You size tasks for a time-blocking day planner. The tasks may be written in English or Italian. " +
      "For each numbered task, give a realistic focused working duration in minutes and a category.\n" +
      'Reply with only a JSON array, one object per task, same order: {"n": number, "minutes": number, ' +
      '"category": "work"|"health"|"medical"|"meeting"|"leisure"|"transport"|"hobby"|"rest", ' +
      '"focus": "deep"|"shallow"}.\n' +
      'Minutes must be a multiple of 15, at least 15, at most 180. Example: [{"n":1,"minutes":90,"category":"deep"}]\n\n' +
      "Tasks:\n" + list;
    return sample.json(prompt, { modelTier: "quick" }).then(function (arr) {
      if (!Array.isArray(arr)) return false;
      var hit = false;
      arr.forEach(function (row) {
        var idx = (parseInt(row && row.n, 10) || 0) - 1;
        var x = need[idx];
        if (!x) return;
        var m = Math.round(Number(row.minutes) / 15) * 15;
        if (isFinite(m) && m >= 15) { x.minutes = Math.min(240, m); x.source = "ai"; hit = true; }
        if (CAT_VARS[row.category]) x.cat = row.category;
        if (row.focus === "deep" || row.focus === "shallow") x.focus = row.focus;
      });
      return hit;
    }, function () { return false; });
  }

  /* ---------------- alarms ----------------
     Browsers cannot wake a closed web app at a set time (Chrome's Notification
     Triggers API was abandoned), so these fire while the page is alive. The
     calendar export below is what covers a closed phone. */
  var audioCtx = null, firedKeys = {}, bannerTimer = null;
  var activeAlert = null;   // the alert currently ringing
  var snoozes = [];         // [{id, at}] pushed back by 5 minutes
  var lastAuto = 0;         // last automatic replan
  var RING_EVERY = 30000;   // repeat the chime this often
  var RING_SLACK = 2000;    // ...allowing for a tick that lands a hair early
  var RING_LIMIT = 600000;  // ...and stop after ten minutes, whatever happens

  // Inside the Capacitor shell the OS schedules the alerts, so they survive the
  // app being closed. On the web this is null and the in-page timer takes over.
  var native = (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform() &&
                window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications) || null;

  function nativeSchedule() {
    if (!native) return;
    var perm = native.requestPermissions ? native.requestPermissions() : Promise.resolve();
    perm.then(function () {
      return native.getPending ? native.getPending() : { notifications: [] };
    }).then(function (pending) {
      var old = (pending && pending.notifications) || [];
      if (!old.length) return;
      return native.cancel({ notifications: old.map(function (n) { return { id: n.id }; }) });
    }).then(function () {
      if (!state.alerts) return;
      var list = [];
      state.tasks.forEach(function (x, i) {
        if (x.start === null || x.done) return;
        var d = state.date.split("-");
        var at = new Date(+d[0], (+d[1]) - 1, +d[2], 0, x.start - state.lead, 0, 0);
        if (at.getTime() < Date.now() + 5000) return;
        var body = (state.lead ? fill(t("ab_soon"), state.lead) : t("ab_now")) + " \u00b7 " +
                   hhmm(x.start) + "\u2013" + hhmm(x.start + x.minutes);
        // repeats stand in for the web build's ringing, six of them over three minutes
        var repeats = state.ring ? 6 : 0;
        for (var r = 0; r <= repeats; r++) {
          list.push({
            id: 9000 + i * 10 + r,
            title: x.title,
            body: body,
            schedule: { at: new Date(at.getTime() + r * RING_EVERY), allowWhileIdle: true }
          });
        }
      });
      if (list.length) return native.schedule({ notifications: list });
    }).catch(function () {});
  }

  function unlockAudio() {
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) { audioCtx = null; }
  }

  function chime() {
    duckMusic();
    if (!state.sound || !audioCtx) return;
    try {
      var t0 = audioCtx.currentTime;
      [1318.5, 1760, 1318.5].forEach(function (f, i) {
        var at = t0 + i * 0.16;
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(f, at);
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(0.32, at + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.42);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(at);
        osc.stop(at + 0.45);
      });
      if (navigator.vibrate) navigator.vibrate([120, 60, 120]);
    } catch (e) {}
  }

  function showBanner(title, timeText, soonMin) {
    duckMusic();
    var pl = document.getElementById("oyvplayer");
    el.alarmbanner.style.bottom = (pl && !pl.classList.contains("off")) ? (pl.offsetHeight + 30) + "px" : "";
    el.abKicker.textContent = soonMin ? fill(t("ab_soon"), soonMin) : t("ab_now");
    el.abTitle.textContent = title;
    el.abTime.textContent = timeText;
    el.alarmbanner.classList.add("up");
    clearTimeout(bannerTimer);
    // While it is ringing the banner waits for you; RING_LIMIT ends it instead.
    if (!state.ring) bannerTimer = setTimeout(hideBanner, 40000);
  }
  function hideBanner() {
    unduckMusic();
    clearTimeout(bannerTimer);
    activeAlert = null;
    el.alarmbanner.classList.remove("up");
  }

  function snoozeAlert() {
    if (activeAlert) snoozes.push({ id: activeAlert.id, at: Date.now() + 5 * 60000 });
    hideBanner();
  }

  // Keeps the chime going until it is dismissed — the point being that you
  // look at the phone. The ten-minute ceiling is there so a missed alert in a
  // meeting, or overnight, cannot ring forever.
  function ringTick() {
    if (!activeAlert || !state.ring) return;
    var now = Date.now();
    if (now - activeAlert.since > RING_LIMIT) { hideBanner(); return; }
    if (now - activeAlert.last < RING_EVERY - RING_SLACK) return;
    activeAlert.last = now;
    var task = byId(activeAlert.id);
    chime();
    if (document.hidden && task) systemNotify(task.title, activeAlert.when);
  }

  // Rebuilds the rest of the day on a timer — but only when something has
  // actually overrun. Without that guard an untouched plan would be shoved
  // forward every cycle and never sit still long enough to follow.
  function autoReplanTick() {
    if (!state.autoReplan || !isToday() || !state.tasks.length) return;
    if (nowMin() >= state.endMin || nowMin() < state.startMin) return;
    var now = Date.now();
    if (lastAuto && now - lastAuto < state.autoReplan * 60000) return;
    var cut = round5(nowMin());
    var overdue = state.tasks.some(function (x) {
      return !x.done && x.start !== null && (x.start + x.minutes) <= cut;
    });
    if (!overdue) return;
    lastAuto = now;
    savedNote = fill(t("replanned_at"), hhmm(nowMin()));
    replanFromNow();
  }

  function systemNotify(title, body) {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    var opts = { body: body, tag: "replan", icon: "icons/icon-192.png", badge: "icons/icon-192.png", renotify: true };
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
        navigator.serviceWorker.getRegistration().then(function (reg) {
          if (reg && reg.showNotification) reg.showNotification(title, opts);
          else new Notification(title, opts);
        }).catch(function () { try { new Notification(title, opts); } catch (e) {} });
      } else {
        new Notification(title, opts);
      }
    } catch (e) {}
  }

  function fireAlert(x) {
    var when = hhmm(x.start) + "\u2013" + hhmm(x.start + x.minutes);
    chime();
    activeAlert = state.ring ? { id: x.id, since: Date.now(), last: Date.now(), when: when } : null;
    showBanner(x.title, when, state.lead || 0);
    if (document.hidden) {
      systemNotify(x.title, (state.lead ? fill(t("ab_soon"), state.lead) : t("ab_now")) + " \u00b7 " + when);
    }
  }

  function nowSeconds() {
    var d = new Date();
    return d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds();
  }

  function checkAlarms() {
    if (native) return;
    if (!state.alerts || state.date !== todayKey()) return;
    var nowMs = Date.now();
    for (var i = snoozes.length - 1; i >= 0; i--) {
      if (nowMs < snoozes[i].at) continue;
      var due = byId(snoozes[i].id);
      snoozes.splice(i, 1);
      if (due && !due.done && due.start !== null) fireAlert(due);
    }
    var now = nowSeconds();
    state.tasks.forEach(function (x) {
      if (x.done || x.start === null) return;
      var target = (x.start - state.lead) * 60;
      var key = state.date + "|" + x.id + "|" + target;
      if (firedKeys[key]) return;
      if (now >= target && now < target + 90) {
        firedKeys[key] = 1;
        fireAlert(x);
      }
    });
  }

  function enableAlerts() {
    unlockAudio();
    if (native) { nativeSchedule(); return; }
    if ("Notification" in window && Notification.permission === "default") {
      try { Notification.requestPermission(); } catch (e) {}
    }
    if ("Notification" in window && Notification.permission === "denied") {
      el.alertsHint.textContent = t("alerts_blocked");
    }
  }

  /* ---------------- calendar export ----------------
     One .ics file per planned day, each block carrying its own reminder, so the
     phone's own calendar app raises the alert even with Replan closed. */
  function icsEscape(v) {
    return String(v).replace(/\\/g, "\\\\").replace(/;/g, "\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  }
  function icsStamp(dateKey, minutes) {
    var parts = dateKey.split("-");
    return parts[0] + parts[1] + parts[2] + "T" + pad(Math.floor(minutes / 60)) + pad(minutes % 60) + "00";
  }
  function buildIcs() {
    var now = new Date();
    var stampUtc = now.getUTCFullYear() + pad(now.getUTCMonth() + 1) + pad(now.getUTCDate()) + "T" +
      pad(now.getUTCHours()) + pad(now.getUTCMinutes()) + pad(now.getUTCSeconds()) + "Z";
    var out = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Replan//Day plan//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
    state.tasks.forEach(function (x, i) {
      if (x.start === null || x.done) return;
      out.push("BEGIN:VEVENT");
      out.push("UID:replan-" + state.date + "-" + i + "-" + x.id + "@replan");
      out.push("DTSTAMP:" + stampUtc);
      out.push("DTSTART:" + icsStamp(state.date, x.start));
      out.push("DTEND:" + icsStamp(state.date, x.start + x.minutes));
      out.push("SUMMARY:" + icsEscape(x.title));
      out.push("CATEGORIES:" + icsEscape(t("cat_" + x.cat)));
      out.push("BEGIN:VALARM");
      out.push("TRIGGER:" + (state.lead ? "-PT" + state.lead + "M" : "PT0S"));
      out.push("ACTION:DISPLAY");
      out.push("DESCRIPTION:" + icsEscape(x.title));
      out.push("END:VALARM");
      out.push("END:VEVENT");
    });
    out.push("END:VCALENDAR");
    return out.join("\r\n") + "\r\n";
  }

  function exportIcs() {
    var planned = state.tasks.filter(function (x) { return x.start !== null && !x.done; });
    if (!planned.length) { el.alertsHint.textContent = t("ics_none"); return; }
    var text = buildIcs();
    var name = "replan-" + state.date + ".ics";
    if (downloads && downloads.save) {
      downloads.save({ filename: name, data: text }).catch(function () {});
      return;
    }
    try {
      var blob = new Blob([text], { type: "text/calendar;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    } catch (e) {}
  }

  /* ---------------- actions ---------------- */
  function plan() {
    readSettings();
    state.text = el.braindump.value;
    var tasks = parseLines(state.text);
    if (!tasks.length) { el.braindump.focus(); return; }
    state.tasks = tasks;
    state.isExample = false;
    state.from = null;
    state.date = dateKey(state.dayOffset);
    render();
    if (!sample) { save(); return; }
    planning = true;
    el.plan.disabled = true;
    el.plan.textContent = t("planning");
    estimate(state.tasks).then(function () {
      planning = false;
      el.plan.disabled = false;
      el.plan.textContent = t("plan");
      render();
      save();
    });
  }

  el.plan.addEventListener("click", plan);
  el.replan.addEventListener("click", replanFromNow);
  el.clear.addEventListener("click", function () {
    state.tasks = [];
    state.text = "";
    state.isExample = false;
    state.from = null;
    el.braindump.value = "";
    render(); save();
  });
  el.dayswitch.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-day]");
    if (b) setDay(+b.getAttribute("data-day"));
  });
  el.langswitch.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-lang]");
    if (b) setLanguage(b.getAttribute("data-lang"));
  });
  ["start", "end", "buffer", "lunch", "protectLunch", "deepFirst"].forEach(function (k) {
    el[k].addEventListener("change", function () { readSettings(); render(); save(); });
  });
  ["alerts", "sound", "ring", "lead", "autoReplan"].forEach(function (k) {
    el[k].addEventListener("change", function () {
      readSettings();
      firedKeys = {};
      if (state.alerts) enableAlerts();
      else hideBanner();
      applyLanguage();
      save();
    });
  });
  el.testAlert.addEventListener("click", function () {
    unlockAudio();
    readSettings();
    var next = state.tasks.filter(function (x) { return x.start !== null && !x.done; })[0];
    chime();
    showBanner(next ? next.title : t("todayblocks"),
               next ? hhmm(next.start) + "\u2013" + hhmm(next.start + next.minutes) : hhmm(nowMin()),
               0);
  });
  el.ics.addEventListener("click", function () { readSettings(); exportIcs(); });
  el.abClose.addEventListener("click", hideBanner);

  /* ---------------- OYV Stream ----------------
     The Spotify embed plays inside the page, so the planner stays on screen.
     Signed in to Spotify in this browser: full tracks. Not signed in: 30-second
     previews. The iframe is only created on first open, so nothing loads from
     Spotify until the button is pressed. */
  var SPOTIFY_URI = "spotify:artist:3YWKlZ0P8bTrTJwrHBGkQ5";
  var SPOTIFY_EMBED = "https://open.spotify.com/embed/artist/3YWKlZ0P8bTrTJwrHBGkQ5?utm_source=oyv_replan&theme=0";
  var player = document.getElementById("oyvplayer"), streamBtn = document.getElementById("oyvstream");
  var spCtl = null, spPaused = true, spApiState = "none", spDucked = false;
  function playerHeight() { return window.innerWidth <= 560 ? 152 : 352; }

  // Spotify's iFrame API gives a controller that can pause and resume the
  // embed, which is what lets an alert silence the music. If the API cannot
  // load (for example inside claude.ai), a plain embed is used instead.
  function plainEmbed(host) {
    var f = document.createElement("iframe");
    f.id = "plFrame";
    f.src = SPOTIFY_EMBED;
    f.title = "OWNYOURVIBE on Spotify";
    f.setAttribute("allow", "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture");
    host.appendChild(f);
  }
  function mountPlayer() {
    var host = document.getElementById("plBody");
    if (document.getElementById("plFrame") || document.getElementById("plMount")) return;
    var mount = document.createElement("div");
    mount.id = "plMount";
    host.appendChild(mount);
    var build = function (IFrameAPI) {
      var target = document.getElementById("plMount");
      if (!target) return;
      IFrameAPI.createController(target, { uri: SPOTIFY_URI, width: "100%", height: playerHeight(), theme: "dark" }, function (ctl) {
        spCtl = ctl;
        var fr = host.querySelector("iframe");
        if (fr) { fr.id = "plFrame"; fr.title = "OWNYOURVIBE on Spotify"; }
        ctl.addListener("playback_update", function (e) {
          spPaused = !!(e && e.data && e.data.isPaused);
        });
      });
    };
    if (window.__oyvSpotifyApi) { build(window.__oyvSpotifyApi); return; }
    if (spApiState === "none") {
      spApiState = "loading";
      window.onSpotifyIframeApiReady = function (IFrameAPI) {
        window.__oyvSpotifyApi = IFrameAPI;
        spApiState = "ready";
        build(IFrameAPI);
      };
      var sc = document.createElement("script");
      sc.src = "https://open.spotify.com/embed/iframe-api/v1";
      sc.async = true;
      sc.onerror = function () { spApiState = "failed"; };
      document.head.appendChild(sc);
    }
    setTimeout(function () {
      if (spApiState !== "ready") {
        var m = document.getElementById("plMount");
        if (m) { m.parentNode.removeChild(m); plainEmbed(host); }
      }
    }, 5000);
  }
  function unmountPlayer() {
    if (spCtl && spCtl.destroy) { try { spCtl.destroy(); } catch (e) {} }
    spCtl = null; spPaused = true; spDucked = false;
    var b = document.getElementById("plBody");
    if (b) b.innerHTML = "";
  }
  // Alerts: pause the music while the alarm sounds, carry on when it is dismissed.
  function duckMusic() {
    if (spCtl && !spPaused && !spDucked) {
      try { spCtl.pause(); spDucked = true; } catch (e) {}
    }
  }
  function unduckMusic() {
    if (spCtl && spDucked) {
      spDucked = false;
      setTimeout(function () { try { spCtl.resume(); } catch (e) {} }, 400);
    }
  }
  function setPlayer(open) {
    if (open) mountPlayer();
    player.classList.toggle("off", !open);
    if (open) player.classList.remove("mini");
    streamBtn.setAttribute("aria-expanded", String(open));
    applyLanguage();
  }
  streamBtn.addEventListener("click", function () {
    var isOpen = !player.classList.contains("off");
    if (isOpen && player.classList.contains("mini")) { player.classList.remove("mini"); applyLanguage(); return; }
    setPlayer(!isOpen);
  });
  document.getElementById("plMin").addEventListener("click", function () { player.classList.toggle("mini"); applyLanguage(); });
  // Minimise keeps the music going; close stops it by removing the player.
  document.getElementById("plClose").addEventListener("click", function () {
    unmountPlayer();
    player.classList.add("off");
    streamBtn.setAttribute("aria-expanded", "false");
  });
  el.abSnooze.addEventListener("click", snoozeAlert);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) checkAlarms(); });
  el.braindump.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); plan(); }
  });
  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { render(); }, 150); });

  function tick() {
    var d = new Date();
    el.clock.textContent = hhmm(d.getHours() * 60 + d.getMinutes());
    el.todaylabel.textContent = d.toLocaleDateString(t("locale"), { weekday: "long", day: "numeric", month: "short" });
  }
  setInterval(tick, 30000);
  setInterval(function () { if (!planning) render(); }, 60000);
  setInterval(function () { checkAlarms(); ringTick(); autoReplanTick(); }, 15000);

  /* ---------------- boot ---------------- */
  lang = detectLang();
  writeSettings();
  applyLanguage();
  // The example day is a welcome, not a daily habit: after the first visit the
  // box opens empty with its prompt.
  var firstVisit = true;
  try { firstVisit = !localStorage.getItem("replan:seen"); localStorage.setItem("replan:seen", "1"); } catch (e) {}
  if (firstVisit) {
    state.text = t("example");
    el.braindump.value = state.text;
    state.tasks = parseLines(state.text);
    state.isExample = true;
    el.saved.textContent = t("saved_example");
  } else {
    state.isExample = false;
  }
  render();

  // Long-press shortcuts on the installed app land here.
  var action = "";
  try { action = new URLSearchParams(window.location.search).get("a") || ""; } catch (e) {}

  var local = null;
  try { local = JSON.parse(localStorage.getItem("replan:" + todayKey()) || "null"); } catch (e) {}
  if (local && applySnapshot(local)) {
    writeSettings();
    el.braindump.value = state.text;
    render();
    el.saved.textContent = t("restored_device");
  }

  if (action === "replan") { replanFromNow(); }
  else if (action === "ics") { setTimeout(exportIcs, 300); }

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("db").then(function (d) {
      if (!d) return;
      db = d;
      return db.doc("days/" + todayKey()).get().then(function (snap) {
        var data = snap && snap.exists ? snap.data() : null;
        if (data && applySnapshot(data)) {
          writeSettings();
          el.braindump.value = state.text;
          render();
          el.saved.textContent = t("restored_account");
        }
      });
    }).catch(function () {});

    window.claude.use("downloads").then(function (d) {
      if (d) downloads = d;
    }).catch(function () {});

    window.claude.use("sample").then(function (s) {
      if (!s) return;
      sample = s;
      el.engine.textContent = t("engine_ai");
    }).catch(function () {});
  }
})();
</script>

</body></html>
