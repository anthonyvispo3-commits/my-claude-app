<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F6F2FF; --line:#E7E3EE; --ink:#0A0A0C; --mute:#6B6875;
  --p:#8F00FF; --p2:#6E00C4; --pSoft:#F1E6FF; --onP:#FFFFFF;
  --ok:#0A0A0C; --warn:#8F00FF; --bad:#C2185B;
  --r:14px; --shadow:0 1px 2px rgba(10,10,12,.04),0 6px 24px rgba(10,10,12,.05);
  --side:232px;
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#0E0D12; --soft:#17141F; --line:#25212E; --ink:#FFFFFF; --mute:#A39FB0;
  --p:#A43DFF; --p2:#8F00FF; --pSoft:#22163A; --onP:#FFFFFF; --bad:#FF5C93;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--p)}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{width:var(--side);flex:0 0 var(--side);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.brand{padding:4px 8px 18px}
.brand img{width:150px;display:block}
.brand small{display:block;margin-top:8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);font-weight:600}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--mute);font-weight:500;width:100%;box-sizing:border-box}
.nav button:hover{background:var(--soft);color:var(--ink)}
.nav button.on{background:var(--ink);color:var(--bg)}
.nav svg{width:18px;height:18px;flex:0 0 18px}
.nav .badge{margin-left:auto;background:var(--p);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;font-weight:600}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:8px}
.main{flex:1;min-width:0;padding:26px 32px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;letter-spacing:-.01em}
.top .sub{color:var(--mute);font-size:13px}
.top .sp{flex:1}
.mbar{display:none}
/* Controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--p);border-color:var(--p);color:var(--onP)}
.btn.pri:hover{background:var(--p2)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--mute);font-weight:600}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px var(--pSoft)}
textarea{min-height:80px;resize:vertical}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters>*{width:auto;min-width:130px}
.filters input{min-width:200px;flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:7px 12px;font-size:13px;color:var(--mute)}
.seg button.on{background:var(--ink);color:var(--bg)}
/* Cards */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 14px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1}
.kpi .l{color:var(--mute);font-size:12px;margin-top:8px;font-weight:500}
.kpi.accent{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi.accent .l{color:var(--bg);opacity:.7}
.kpi.purple{background:var(--p);color:#fff;border-color:var(--p)}
.kpi.purple .l{color:#fff;opacity:.8}
.two{grid-template-columns:1.4fr 1fr}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
/* Status bar */
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--soft)}
.stack span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.bars .row{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.bars .row:last-child{border:0}
.bars .track{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bars .fill{height:100%;background:var(--p);border-radius:99px}
.bars .num{text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
/* Lists */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.item:last-child{border-bottom:0}
.item:hover{background:var(--soft);border-radius:10px}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .grow{flex:1;min-width:0}
.empty{color:var(--mute);padding:22px 4px;text-align:center;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid var(--line);color:var(--mute)}
.pill.s-todo{color:var(--mute)}
.pill.s-progress{border-color:var(--ink);color:var(--ink)}
.pill.s-review{border-color:var(--p);color:var(--p)}
.pill.s-done{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill.s-blocked{background:var(--bad);border-color:var(--bad);color:#fff}
.pill.p-Urgent{background:var(--p);border-color:var(--p);color:#fff}
.pill.p-High{border-color:var(--p);color:var(--p)}
.pill.late{border-color:var(--bad);color:var(--bad)}
.dot{width:8px;height:8px;border-radius:99px;flex:0 0 8px}
.av{width:32px;height:32px;border-radius:99px;background:var(--pSoft);color:var(--p);display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 32px}
.av.k{background:var(--ink);color:var(--bg)}
/* Table */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:left;padding:10px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.r{cursor:pointer}
.tbl tr.r:hover td{background:var(--soft)}
.tbl .t{font-weight:600}
.tbl .m{font-size:12px;color:var(--mute)}
/* Board */
.board{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--soft);border-radius:var(--r);padding:12px;min-height:200px}
.col h4{margin:2px 4px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:8px;align-items:center}
.col h4 span{color:var(--mute);font-weight:500}
.col.over{outline:2px dashed var(--p)}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;cursor:grab}
.tcard .t{font-weight:600;margin-bottom:8px}
.tcard .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mute)}
/* Drops */
.drop{display:flex;flex-direction:column;gap:10px}
.drop .name{font-size:17px;font-weight:700}
.prog{height:6px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--p)}
/* Chain */
.chain{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.chain .step{border:1px solid var(--line);border-radius:99px;padding:3px 9px;color:var(--mute)}
.chain .step.done{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chain .step.cur{background:var(--p);color:#fff;border-color:var(--p)}
.chain .arr{color:var(--mute)}
/* Team */
.team h4{margin:0 0 10px;font-size:14px}
.agent{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.agent:last-child{border:0}
.agent .n{font-weight:600;font-size:13px}
.agent .r{font-size:12px;color:var(--mute)}
.agent .c{margin-left:auto;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(10,10,12,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.on{display:flex}
.modal{background:var(--surface);border-radius:18px;width:min(640px,100%);max-height:92vh;overflow:auto;padding:22px;border:1px solid var(--line)}
.modal h2{margin:0 0 16px;font-size:18px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.mfoot .sp{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:60;pointer-events:none;font-weight:500}
.toast.on{opacity:1;transform:translateX(-50%)}
.hint{font-size:12px;color:var(--mute)}
.alert{border-left:3px solid var(--p);padding-left:12px}
.alert.crit{border-left-color:var(--bad)}
.tabs{display:none}
@media (max-width:480px){.item .dp{display:none}}
.hide{display:none!important}
/* Responsive */
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:1fr}.three{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  .side{display:none}
  .main{padding:16px 16px 96px}
  .mbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;background:var(--bg);padding:12px 16px;margin:-16px -16px 14px;border-bottom:1px solid var(--line)}
  
  .mbar .sp{flex:1}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabs button{all:unset;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mute);padding:4px 0;cursor:pointer;position:relative}
  .tabs button.on{color:var(--p)}
  .tabs svg{width:21px;height:21px}
  .tabs .badge{position:absolute;top:0;left:55%;background:var(--p);color:#fff;border-radius:99px;font-size:9px;padding:0 5px;font-weight:700}
  .top h1{font-size:19px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .v{font-size:24px}
  .three{grid-template-columns:1fr}
  .filters>*{min-width:0;flex:1 1 45%}
  .filters input{flex-basis:100%}
  .fgrid{grid-template-columns:1fr}
  .bars .row{grid-template-columns:110px 1fr 44px}
  .tbl thead{display:none}
  .tbl tr.r{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .tbl td{border:0;padding:0}
  .tbl td.hm{display:none}
  .board{grid-template-columns:repeat(5,82vw);scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
  .modal{border-radius:18px 18px 0 0;align-self:flex-end;max-height:94vh}
  .ov{padding:0}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
.hdr{position:sticky;top:0;z-index:25;background:var(--bg);border-bottom:1px solid var(--line);padding:18px 32px 16px}
.hdr .lg{height:44px;width:auto;display:block}
.lg-d{display:none!important}
:root[data-theme="dark"] .lg-l{display:none!important}
:root[data-theme="dark"] .lg-d{display:block!important}
.side{top:79px!important;height:calc(100vh - 79px)!important;padding-top:18px!important}
.mlogo{min-width:0;flex:1 1 auto}
.mlogo .lg{height:auto;width:100%;max-width:260px;display:block}
@media (max-width:820px){.hdr{display:none}}
.langsw{padding:0;overflow:hidden;align-self:flex-start;gap:0}
.langsw span{padding:6px 12px;font-weight:600;letter-spacing:.06em;color:var(--mute)}
.langsw span.on{background:var(--ink);color:var(--bg)}
.lang2{font-weight:700;letter-spacing:.06em;min-width:40px;justify-content:center}
</style>

function t(k, v){ let s = (L[LANG] && L[LANG][k]); if (s === undefined) s = L.en[k]; if (s === undefined) return k; if (v && typeof s === 'string') s = s.replace(/\{(\w+)\}/g, (m, x) => v[x] !== undefined ? v[x] : m); return s; }
const roleOf = a => LANG === 'it' ? a.roleIt : a.role;
const teamName = tm => LANG === 'it' ? (TEAM_IT[tm] || tm) : tm;
const SL = s => t('st_' + s);

const initials = n => n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date(new Date().toDateString());
const iso = d => { const z=new Date(d); z.setMinutes(z.getMinutes()-z.getTimezoneOffset()); return z.toISOString().slice(0,10); };
const addDays = n => { const d=today(); d.setDate(d.getDate()+n); return iso(d); };
const fmtDate = s => s ? new Date(s+'T00:00').toLocaleDateString(t('locale'),{day:'numeric',month:'short'}) : '—';
const fmtStamp = ms => new Date(ms).toLocaleString(t('locale'),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const uid = () => Math.random().toString(36).slice(2,9);
function chainOf(id){ const out=[]; let c=A[id]; while(c && c.boss){ out.push(c.boss); c=A[c.boss]; } return out; }

const isLate = t_ => t_.status!=='done' && t_.due && new Date(t_.due+'T00:00') < today();

function steps(x){ if(x.approval==='none') return []; return chainOf(x.owner).slice(0, +x.approval); }

function dropName(id){ return S.drops.find(d=>d.id===id)?.name || '—'; }
function pill(status){ return `<span class="pill s-${status}">${SL(status)}</span>`; }
function prioPill(p){ return `<span class="pill p-${p}">${t('pr_'+p)}</span>`; }
function toast(m){ const el=document.getElementById('toast'); el.textContent=m; el.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('on'),2200); }
const H3 = 'style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)"';

/* ===================== NAV ===================== */
const ICONS={
 dash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>',
 tasks:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.5 1.5L7.5 5M3.5 12l1.5 1.5 2.5-2.5M3.5 18l1.5 1.5 2.5-2.5"/></svg>',
 drops:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6" opacity=".5"/></svg>',
 appr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 4 6v6c0 4.5 3.4 8.3 8 9 4.6-.7 8-4.5 8-9V6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
 alerts:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
 team:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.6c2.6-.2 4.7 1.4 5.5 4.4"/></svg>',
};
const PAGES=['dash','tasks','drops','appr','alerts','team'];
let page='dash', taskView='list', F={q:'',team:'',owner:'',status:'',drop:''};
function badges(){ return {appr:pendingFor(S.as).length, alerts:S.alerts.filter(a=>a.state!=='Resolved').length}; }
function renderNav(){
  const b=badges();
  const html=PAGES.map(k=>`<button class="${page===k?'on':''}" data-p="${k}">${ICONS[k]}<span>${t('pg_'+k)}</span>${b[k]?`<span class="badge">${b[k]}</span>`:''}</button>`).join('');
  document.getElementById('nav').innerHTML=html; document.getElementById('tabs').innerHTML=html;
  document.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>go(x.dataset.p));
}
function go(p,filters){ page=p; if(filters) F={q:'',team:'',owner:'',status:'',drop:'',...filters}; render(); window.scrollTo(0,0); }

/* ===================== STATIC LABELS ===================== */
function applyStatic(){
  document.documentElement.lang = LANG;
  const set=(id,txt)=>{ const e=document.getElementById(id); if(e) e.textContent=txt; };
  set('asLbl', t('viewing_as')); set('themeBtn', t('theme')); set('dataBtn', t('backup'));
  const lb=document.getElementById('langBtn'); if(lb){ lb.innerHTML=`<span class="${LANG==='en'?'on':''}">EN</span><span class="${LANG==='it'?'on':''}">IT</span>`; lb.title=t('lang_btn'); lb.setAttribute('aria-label',t('lang_btn')); }
  const lb2=document.getElementById('langBtn2'); if(lb2){ lb2.textContent=LANG==='en'?'IT':'EN'; lb2.title=t('lang_btn'); lb2.setAttribute('aria-label',t('lang_btn')); }
  const ab=document.getElementById('asBtn2'); if(ab) ab.setAttribute('aria-label',t('viewing_as'));
  const tb=document.getElementById('themeBtn2'); if(tb) tb.setAttribute('aria-label',t('theme'));
  const db=document.getElementById('dataBtn2'); if(db) db.setAttribute('aria-label',t('backup'));
  asSel.innerHTML=agentOpts(S.as);
}
function setLang(l){ if(l===LANG) return; LANG=l; S.lang=l; save(); applyStatic(); render(); }

/* ===================== VIEWS ===================== */
function render(){
  renderNav();
  const v=document.getElementById('view'), ta=document.getElementById('topActions');
  document.getElementById('pgTitle').textContent=t('pg_'+page);
  const me=A[S.as]; document.getElementById('pgSub').textContent=t('viewing_as_sub',{name:me.name,role:roleOf(me)});
  asSel.value=S.as;
  ta.innerHTML='';
  if(page==='dash'){ ta.innerHTML=`<button class="btn pri" onclick="taskForm()">${t('new_task')}</button>`; v.innerHTML=viewDash(); }
  if(page==='tasks'){ ta.innerHTML=`<div class="seg"><button class="${taskView==='list'?'on':''}" onclick="taskView='list';render()">${t('list')}</button><button class="${taskView==='board'?'on':''}" onclick="taskView='board';render()">${t('board')}</button></div> <button class="btn pri" onclick="taskForm()">${t('new_task')}</button>`; v.innerHTML=viewTasks(); bindFilters(); if(taskView==='board') bindDnD(); }
  if(page==='drops'){ ta.innerHTML=`<button class="btn pri" onclick="dropForm()">${t('new_drop')}</button>`; v.innerHTML=viewDrops(); }
  if(page==='appr'){ v.innerHTML=viewAppr(); }
  if(page==='alerts'){ ta.innerHTML=`<button class="btn pri" onclick="alertForm()">${t('raise_alert')}</button>`; v.innerHTML=viewAlerts(); }
  if(page==='team'){ v.innerHTML=viewTeam(); }
}

function viewDash(){
  const T=S.tasks, open=T.filter(x=>x.status!=='done');
  const done=T.filter(x=>x.status==='done').length, pct=T.length?Math.round(done/T.length*100):0;
  const k=[[t('k_open'),open.length,''],[t('k_week'),T.filter(dueWeek).length,''],[t('k_overdue'),T.filter(isLate).length,''],[t('k_blocked'),T.filter(x=>x.status==='blocked').length,''],[t('k_await'),T.filter(x=>x.apState==='pending').length,'accent'],[t('k_done'),pct+'%','purple']];
  const kp=k.map(([l,v,c])=>`<div class="card kpi ${c}"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
  const total=T.length||1;
  const stack=STATUS_KEYS.map(s=>{const n=T.filter(x=>x.status===s).length; return n?`<span style="width:${n/total*100}%;background:${COLORS[s]}" title="${SL(s)}: ${n}"></span>`:'';}).join('');
  const leg=STATUS_KEYS.map(s=>`<span><i style="background:${COLORS[s]}"></i>${SL(s)} ${T.filter(x=>x.status===s).length}</span>`).join('');
  const teams=[...new Set(AGENTS.map(a=>a.team))].map(tm=>{const tt=T.filter(x=>teamOf(x.owner)===tm); return {tm,n:tt.length,d:tt.filter(x=>x.status==='done').length};}).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  const bars=teams.length?teams.map(x=>`<div class="row" style="cursor:pointer" onclick="go('tasks',{team:'${esc(x.tm).replace(/&#39;/g,"\\'")}'})"><span>${esc(teamName(x.tm))}</span><div class="track"><div class="fill" style="width:${x.d/x.n*100}%"></div></div><span class="num">${x.d}/${x.n}</span></div>`).join(''):`<div class="empty">${t('no_tasks')}</div>`;
  const upcoming=open.filter(x=>x.due).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,6);
  const up=upcoming.length?upcoming.map(taskItem).join(''):`<div class="empty">${t('nothing_due')}</div>`;
  const mine=pendingFor(S.as);
  const appr=mine.length?mine.slice(0,5).map(taskItem).join(''):`<div class="empty">${t('no_appr_for',{name:esc(A[S.as].name)})}</div>`;
  const drops=S.drops.filter(d=>d.status!=='Launched').sort((a,b)=>(a.date||'').localeCompare(b.date||'')).slice(0,3).map(dropMini).join('')||`<div class="empty">${t('no_drops_active')}</div>`;
  const al=S.alerts.filter(a=>a.state!=='Resolved').slice(0,4).map(alertItem).join('')||`<div class="empty">${t('no_alerts')}</div>`;
  const act=S.activity.slice(0,7).map(a=>`<div class="item" style="cursor:default"><div class="grow"><div class="m" style="color:var(--ink);white-space:normal">${esc(logText(a))}</div><div class="m">${fmtStamp(a.t)}</div></div></div>`).join('');
  return `<div class="grid kpis">${kp}</div>
  <div class="grid two" style="margin-top:16px">
    <div class="card"><h3>${t('task_status')}</h3><div class="stack">${stack}</div><div class="legend">${leg}</div>
      <h3 style="margin-top:22px">${t('by_team')}</h3><div class="bars">${bars}</div></div>
    <div class="card"><h3>${t('coming_up')}<span class="sp"></span><button class="btn sm" onclick="go('tasks')">${t('all_tasks')}</button></h3><div class="list">${up}</div></div>
  </div>
  <div class="grid three" style="margin-top:16px">
    <div class="card"><h3>${t('active_drops')}</h3>${drops}</div>
    <div class="card"><h3>${t('my_approvals')}<span class="sp"></span><span class="pill">${mine.length}</span></h3><div class="list">${appr}</div></div>
    <div class="card"><h3>${t('open_alerts')}</h3><div class="list">${al}</div></div>
  </div>
  <div class="card" style="margin-top:16px"><h3>${t('recent')}</h3><div class="list">${act}</div></div>`;
}
function taskItem(x){
  const o=A[x.owner];
  return `<div class="item" onclick="taskForm('${x.id}')"><div class="av">${initials(o.name)}</div><div class="grow"><div class="t">${esc(x.title)}</div><div class="m">${esc(o.name)} · ${esc(roleOf(o))}</div></div><span class="pill dp ${isLate(x)?'late':''}">${fmtDate(x.due)}</span>${pill(x.status)}</div>`;
}
function dropStats(d){ const tt=S.tasks.filter(x=>x.drop===d.id); const dn=tt.filter(x=>x.status==='done').length; return {n:tt.length,dn,p:tt.length?Math.round(dn/tt.length*100):0, bl:tt.filter(x=>x.status==='blocked').length}; }
function dropMini(d){ const s=dropStats(d); return `<div style="padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer" onclick="go('tasks',{drop:'${d.id}'})"><div style="display:flex;gap:8px;align-items:center"><div class="t" style="font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.name)}</div><span class="pill">${fmtDate(d.date)}</span></div><div class="prog" style="margin:8px 0 4px"><span style="width:${s.p}%"></span></div><div class="hint">${t('tasks_n',{d:s.dn,n:s.n})} · ${s.p}%${s.bl?` · <b style="color:var(--bad)">${t('blocked_n',{n:s.bl})}</b>`:''}</div></div>`; }

function filtered(){
  return S.tasks.filter(x=>{
    if(F.q && !(x.title+' '+x.desc+' '+A[x.owner].name).toLowerCase().includes(F.q.toLowerCase())) return false;
    if(F.team && teamOf(x.owner)!==F.team) return false;
    if(F.owner && x.owner!==F.owner) return false;
    if(F.status && x.status!==F.status) return false;
    if(F.drop && x.drop!==F.drop) return false;
    return true;
  }).sort((a,b)=>(a.status==='done')-(b.status==='done') || (a.due||'9').localeCompare(b.due||'9'));
}
function viewTasks(){
  const teams=[...new Set(AGENTS.map(a=>a.team))];
  const f=`<div class="filters"><input id="fq" placeholder="${esc(t('search'))}" value="${esc(F.q)}">
   <select id="fteam"><option value="">${t('all_teams')}</option>${teams.map(tm=>`<option value="${esc(tm)}" ${F.team===tm?'selected':''}>${esc(teamName(tm))}</option>`).join('')}</select>
   <select id="fowner">${agentOpts(F.owner,t('all_people'))}</select>
   ${taskView==='list'?`<select id="fstatus"><option value="">${t('all_statuses')}</option>${STATUS_KEYS.map(s=>`<option value="${s}" ${F.status===s?'selected':''}>${SL(s)}</option>`).join('')}</select>`:''}
   <select id="fdrop"><option value="">${t('all_drops')}</option>${S.drops.map(d=>`<option value="${d.id}" ${F.drop===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select>
   ${(F.q||F.team||F.owner||F.status||F.drop)?`<button class="btn" onclick="F={q:'',team:'',owner:'',status:'',drop:''};render()">${t('clear')}</button>`:''}</div>`;
  const list=filtered();
  if(taskView==='board'){
    const cols=STATUS_KEYS.map(s=>{const tt=list.filter(x=>x.status===s); return `<div class="col" data-s="${s}"><h4><i class="dot" style="background:${COLORS[s]}"></i>${SL(s)} <span>${tt.length}</span></h4>${tt.map(x=>`<div class="tcard" draggable="true" data-id="${x.id}" onclick="taskForm('${x.id}')"><div class="t">${esc(x.title)}</div><div class="row"><span class="av" style="width:22px;height:22px;flex-basis:22px;font-size:9px">${initials(A[x.owner].name)}</span>${esc(A[x.owner].name.split(' ')[0])} · <span class="pill ${isLate(x)?'late':''}">${fmtDate(x.due)}</span>${x.prio==='Urgent'||x.prio==='High'?prioPill(x.prio):''}${x.apState==='pending'?`<span class="pill s-review">${t('approval')}</span>`:''}</div></div>`).join('')}</div>`;}).join('');
    return f+`<div class="board">${cols}</div><p class="hint">${t('drag_hint')}</p>`;
  }
  const rows=list.map(x=>{const o=A[x.owner]; return `<tr class="r" onclick="taskForm('${x.id}')"><td><div class="t">${esc(x.title)}</div><div class="m">${esc(dropName(x.drop))}</div></td><td class="hm"><div style="display:flex;gap:8px;align-items:center"><div class="av">${initials(o.name)}</div><div><div>${esc(o.name)}</div><div class="m">${esc(roleOf(o))}</div></div></div></td><td>${pill(x.status)}</td><td class="hm">${prioPill(x.prio)}</td><td class="hm"><span class="pill ${isLate(x)?'late':''}">${fmtDate(x.due)}</span></td><td class="hm">${x.apState==='pending'?`<span class="pill s-review">→ ${esc(A[curApprover(x)].name.split(' ')[0])}</span>`:x.apState==='approved'?`<span class="pill s-done">${t('approved')}</span>`:'<span class="m">—</span>'}</td></tr>`;}).join('');
  return f+`<div class="card" style="padding:6px 14px">${list.length?`<table class="tbl"><thead><tr><th>${t('th_task')}</th><th>${t('th_owner')}</th><th>${t('th_status')}</th><th>${t('th_prio')}</th><th>${t('th_due')}</th><th>${t('th_appr')}</th></tr></thead><tbody>${rows}</tbody></table>`:`<div class="empty">${t('no_match')}</div>`}</div>`;
}
function bindFilters(){
  const on=(id,k,ev='change')=>{const el=document.getElementById(id); if(el) el.addEventListener(ev,()=>{F[k]=el.value; if(k==='q'){ const pos=el.selectionStart; render(); const n=document.getElementById('fq'); n.focus(); n.setSelectionRange(pos,pos);} else render();});};
  on('fq','q','input'); on('fteam','team'); on('fowner','owner'); on('fstatus','status'); on('fdrop','drop');
}
function bindDnD(){
  let dragId=null;
  document.querySelectorAll('.tcard').forEach(c=>c.addEventListener('dragstart',e=>{dragId=c.dataset.id; e.dataTransfer.effectAllowed='move';}));
  document.querySelectorAll('.col').forEach(col=>{
    col.addEventListener('dragover',e=>{e.preventDefault(); col.classList.add('over');});
    col.addEventListener('dragleave',()=>col.classList.remove('over'));
    col.addEventListener('drop',e=>{e.preventDefault(); col.classList.remove('over'); const x=S.tasks.find(y=>y.id===dragId); if(x) setStatus(x,col.dataset.s);});
  });
}
function setStatus(x,s){
  if(x.status===s) return;
  if(s==='done' && x.approval!=='none' && x.apState!=='approved'){ x.status='review'; if(x.apState!=='pending'){x.apState='pending';x.apStep=0;} log('lg_sent_appr',{name:A[x.owner].name,task:x.title}); save(); render(); toast(t('t_needs_appr',{name:A[curApprover(x)].name})); return; }
  if(s==='review' && x.approval!=='none' && x.apState!=='pending' && x.apState!=='approved'){ x.apState='pending'; x.apStep=0; }
  x.status=s; log('lg_status',{task:x.title,statusKey:s}); save(); render();
}

function viewDrops(){
  if(!S.drops.length) return `<div class="card empty">${t('no_drops')}</div>`;
  return `<div class="grid three">${S.drops.sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(d=>{const s=dropStats(d); const Ld=A[d.lead]; return `<div class="card drop"><div style="display:flex;gap:8px;align-items:center"><span class="pill ${d.status==='Launched'?'s-done':d.status==='In production'?'s-progress':d.status==='Ready'?'s-review':''}">${t('ds_'+d.status)}</span><span class="sp" style="flex:1"></span><button class="btn sm" onclick="dropForm('${d.id}')">${t('edit')}</button></div><div class="name">${esc(d.name)}</div><div class="hint">${t('drop_meta',{type:esc(t('dt_'+d.type)),date:fmtDate(d.date)})}${Ld?t('drop_lead',{name:esc(Ld.name)}):''}</div>${d.desc?`<div style="font-size:13px">${esc(d.desc)}</div>`:''}<div class="prog"><span style="width:${s.p}%"></span></div><div class="hint">${t('done_pct',{d:s.dn,n:s.n,p:s.p})}${s.bl?` · <b style="color:var(--bad)">${t('blocked_n',{n:s.bl})}</b>`:''}</div><div style="display:flex;gap:8px"><button class="btn sm dark" onclick="go('tasks',{drop:'${d.id}'})">${t('open_tasks')}</button><button class="btn sm" onclick="taskForm(null,'${d.id}')">${t('plus_task')}</button></div></div>`;}).join('')}</div>`;
}

function chainHtml(x){
  const s=steps(x); if(!s.length) return `<span class="hint">${t('no_appr_needed')}</span>`;
  return '<div class="chain">'+s.map((id,i)=>{let c=''; if(x.apState==='approved'||(x.apState==='pending'&&i<x.apStep)) c='done'; else if(x.apState==='pending'&&i===x.apStep) c='cur'; return (i?'<span class="arr">›</span>':'')+`<span class="step ${c}">${esc(A[id].name.split(' ')[0])} · ${esc(roleOf(A[id]))}</span>`;}).join('')+'</div>';
}
function viewAppr(){
  const all=S.tasks.filter(x=>x.apState==='pending');
  const mine=pendingFor(S.as), others=all.filter(x=>!mine.includes(x));
  const card=x=>`<div class="card" style="margin-bottom:12px"><div style="display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap"><div class="grow" style="flex:1;min-width:200px"><div style="font-weight:700;cursor:pointer" onclick="taskForm('${x.id}')">${esc(x.title)}</div><div class="hint">${esc(A[x.owner].name)} · ${esc(roleOf(A[x.owner]))} · ${esc(dropName(x.drop))} · ${t('due',{date:fmtDate(x.due)})}</div></div>${prioPill(x.prio)}</div><div style="margin:12px 0">${chainHtml(x)}</div>${curApprover(x)===S.as?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri sm" onclick="approve('${x.id}')">${t('approve')}</button><button class="btn sm" onclick="sendBack('${x.id}')">${t('req_changes')}</button></div>`:`<div class="hint">${t('waiting_on',{name:esc(A[curApprover(x)].name)})}</div>`}</div>`;
  return `<p class="hint" style="margin-top:-8px">${t('appr_intro')}</p>
  <h3 ${H3}>${t('waiting_for',{name:esc(A[S.as].name),n:mine.length})}</h3>${mine.length?mine.map(card).join(''):`<div class="card empty">${t('nothing_for_you')}</div>`}
  <h3 ${H3.replace('"','"margin-top:24px;')}>${t('other_pending',{n:others.length})}</h3>${others.length?others.map(card).join(''):`<div class="card empty">${t('none')}</div>`}`;
}
function approve(id){ const x=S.tasks.find(y=>y.id===id); const who=A[S.as].name; const s=steps(x); x.apStep++; if(x.apStep>=s.length){ x.apState='approved'; x.status='done'; log('lg_final',{name:who,task:x.title}); toast(t('t_approved_done')); } else { log('lg_appr_next',{name:who,task:x.title,next:A[s[x.apStep]].name}); toast(t('t_approved_next',{name:A[s[x.apStep]].name})); } save(); render(); }
function sendBack(id){ const x=S.tasks.find(y=>y.id===id); const note=prompt(t('changes_prompt'))||''; x.apState='none'; x.apStep=0; x.status='progress'; if(note) x.desc=(x.desc?x.desc+'\n':'')+t('changes_note',{name:A[S.as].name,note}); log('lg_changes',{name:A[S.as].name,task:x.title}); save(); render(); toast(t('t_sent_back',{name:A[x.owner].name})); }

function alertItem(a){ const b=A[a.by]; return `<div class="item alert ${a.sev==='Critical'?'crit':''}" onclick="alertForm('${a.id}')"><div class="grow"><div class="t">${esc(a.title)}</div><div class="m">${esc(b.name)} · ${t('sev_'+a.sev)} · ${t('as_'+a.state)}</div></div></div>`; }
function viewAlerts(){
  const open=S.alerts.filter(a=>a.state!=='Resolved'), res=S.alerts.filter(a=>a.state==='Resolved');
  const row=a=>{const b=A[a.by]; return `<div class="card alert ${a.sev==='Critical'?'crit':''}" style="margin-bottom:12px"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><div style="flex:1;min-width:200px"><div style="font-weight:700">${esc(a.title)}</div><div class="hint">${t('raised_by',{name:esc(b.name),role:esc(roleOf(b)),date:fmtStamp(a.created)})}</div></div><span class="pill ${a.sev==='Critical'?'s-blocked':a.sev==='High'?'p-Urgent':''}">${t('sev_'+a.sev)}</span><span class="pill ${a.state==='Resolved'?'s-done':a.state==='Acknowledged'?'s-review':''}">${t('as_'+a.state)}</span></div>${a.note?`<div style="margin-top:10px;font-size:13px;white-space:pre-wrap">${esc(a.note)}</div>`:''}<div class="hint" style="margin-top:10px">${t('route',{name:esc(b.name)})}</div><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">${a.state==='Open'?`<button class="btn sm dark" onclick="alertState('${a.id}','Acknowledged')">${t('acknowledge')}</button>`:''}${a.state!=='Resolved'?`<button class="btn sm pri" onclick="alertState('${a.id}','Resolved')">${t('resolve')}</button>`:`<button class="btn sm" onclick="alertState('${a.id}','Open')">${t('reopen')}</button>`}<button class="btn sm" onclick="alertForm('${a.id}')">${t('edit')}</button></div></div>`;};
  return `<p class="hint" style="margin-top:-8px">${t('alert_intro')}</p>${open.length?open.map(row).join(''):`<div class="card empty">${t('no_open_alerts')}</div>`}${res.length?`<h3 ${H3.replace('"','"margin-top:24px;')}>${t('resolved_n',{n:res.length})}</h3>${res.map(row).join('')}`:''}`;
}
function alertState(id,st){ const a=S.alerts.find(x=>x.id===id); a.state=st; log('lg_alert_state',{title:a.title,stateKey:st}); save(); render(); }

function viewTeam(){
  const groups=[...new Set(AGENTS.map(a=>a.team))];
  return `<div class="grid three">${groups.map(g=>{const ag=AGENTS.filter(a=>a.team===g); return `<div class="card team"><h4>${esc(teamName(g))} <span class="hint">· ${ag.length}</span></h4>${ag.map(a=>{const tt=S.tasks.filter(x=>x.owner===a.id); const op=tt.filter(x=>x.status!=='done').length; const bl=tt.filter(x=>x.status==='blocked').length; return `<div class="agent" onclick="go('tasks',{owner:'${a.id}'})"><div class="av ${a.boss===null||a.id==='william'?'k':''}">${initials(a.name)}</div><div style="min-width:0"><div class="n">${esc(a.name)}${TEAM_LEADERS.includes(a.id)?` <span class="pill" style="font-size:9px;padding:0 6px">${t('lead_tag')}</span>`:''}</div><div class="r">${esc(roleOf(a))}${a.boss?` · → ${esc(A[a.boss].name.split(' ')[0])}`:''}</div></div><div class="c">${t('open_n',{n:op})}${bl?` · <b style="color:var(--bad)">${bl}</b>`:''}</div></div>`;}).join('')}</div>`;}).join('')}</div>`;
}

/* ===================== FORMS ===================== */
function openModal(h){ document.getElementById('modal').innerHTML=h; document.getElementById('ov').classList.add('on'); }
function closeModal(){ document.getElementById('ov').classList.remove('on'); }
document.getElementById('ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });

function taskForm(id,dropId){
  const x=id?S.tasks.find(y=>y.id===id):{title:'',owner:S.as==='founder'?'william':S.as,status:'todo',prio:'Medium',due:addDays(7),drop:dropId||F.drop||'',approval:'1',desc:''};
  openModal(`<h2>${id?t('f_edit_task'):t('f_new_task')}</h2><div class="fgrid">
   <div class="field full"><label>${t('f_task')}</label><input id="t_title" value="${esc(x.title)}" placeholder="${esc(t('f_task_ph'))}"></div>
   <div class="field full"><label>${t('f_owner')}</label><select id="t_owner">${agentOpts(x.owner)}</select></div>
   <div class="field"><label>${t('f_status')}</label><select id="t_status">${STATUS_KEYS.map(s=>`<option value="${s}" ${x.status===s?'selected':''}>${SL(s)}</option>`).join('')}</select></div>
   <div class="field"><label>${t('f_prio')}</label><select id="t_prio">${PRIOS.map(p=>`<option value="${p}" ${x.prio===p?'selected':''}>${t('pr_'+p)}</option>`).join('')}</select></div>
   <div class="field"><label>${t('f_due')}</label><input type="date" id="t_due" value="${x.due||''}"></div>
   <div class="field"><label>${t('f_drop')}</label><select id="t_drop"><option value="">${t('f_none')}</option>${S.drops.map(d=>`<option value="${d.id}" ${x.drop===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div>
   <div class="field full"><label>${t('f_appr')}</label><select id="t_appr">${APPROVAL_KEYS.map(v=>`<option value="${v}" ${x.approval===v?'selected':''}>${t('ap_'+v)}</option>`).join('')}</select><div id="t_chain" style="margin-top:6px"></div></div>
   <div class="field full"><label>${t('f_notes')}</label><textarea id="t_desc" placeholder="${esc(t('f_notes_ph'))}">${esc(x.desc)}</textarea></div>
  </div><div class="mfoot">${id?`<button class="btn" style="color:var(--bad)" onclick="delTask('${id}')">${t('delete')}</button>`:''}${id&&x.status==='blocked'?`<button class="btn" onclick="alertFromTask('${id}')">${t('f_raise')}</button>`:''}<span class="sp"></span><button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn pri" onclick="saveTask(${id?`'${id}'`:'null'})">${t('save')}</button></div>`);
  const upd=()=>{ const tmp={owner:val('t_owner'),approval:val('t_appr'),apState:'none',apStep:0}; const s=steps(tmp); document.getElementById('t_chain').innerHTML=s.length?'<div class="chain">'+s.map((y,i)=>(i?'<span class="arr">›</span>':'')+`<span class="step">${esc(A[y].name)}</span>`).join('')+'</div>':''; };
  document.getElementById('t_owner').onchange=upd; document.getElementById('t_appr').onchange=upd; upd();
  setTimeout(()=>document.getElementById('t_title').focus(),50);
}
const val=id=>document.getElementById(id).value;
function saveTask(id){
  const title=val('t_title').trim(); if(!title){ toast(t('t_name_task')); return; }
  let x=id?S.tasks.find(y=>y.id===id):null;
  const data={title,owner:val('t_owner'),status:val('t_status'),prio:val('t_prio'),due:val('t_due'),drop:val('t_drop'),approval:val('t_appr'),desc:val('t_desc')};
  if(!x){ x={id:uid(),created:Date.now(),apState:'none',apStep:0,log:[],...data,status:'todo'}; S.tasks.push(x); log('lg_new_task',{name:A[x.owner].name,task:x.title}); }
  else { const ownerChanged=x.owner!==data.owner||x.approval!==data.approval; Object.assign(x,{...data,status:x.status}); if(ownerChanged){x.apState=x.status==='done'&&x.approval==='none'?'none':x.apState==='approved'?'approved':'none'; x.apStep=0;} log('lg_upd_task',{task:x.title}); }
  closeModal(); setStatus(x,data.status); save(); render();
}
function delTask(id){ if(!confirm(t('c_del_task'))) return; const x=S.tasks.find(y=>y.id===id); S.tasks=S.tasks.filter(y=>y.id!==id); log('lg_del_task',{task:x.title}); save(); closeModal(); render(); }

function dropForm(id){
  const d=id?S.drops.find(x=>x.id===id):{name:'',type:'Music + Apparel',date:addDays(30),status:'Planning',lead:'felix',desc:''};
  openModal(`<h2>${id?t('f_edit_drop'):t('f_new_drop')}</h2><div class="fgrid">
   <div class="field full"><label>${t('f_name')}</label><input id="d_name" value="${esc(d.name)}" placeholder="${esc(t('f_name_ph'))}"></div>
   <div class="field"><label>${t('f_type')}</label><select id="d_type">${DROP_TYPES.map(x=>`<option value="${x}" ${d.type===x?'selected':''}>${t('dt_'+x)}</option>`).join('')}</select></div>
   <div class="field"><label>${t('f_release')}</label><input type="date" id="d_date" value="${d.date||''}"></div>
   <div class="field"><label>${t('f_status')}</label><select id="d_status">${DROP_STATUS.map(x=>`<option value="${x}" ${d.status===x?'selected':''}>${t('ds_'+x)}</option>`).join('')}</select></div>
   <div class="field"><label>${t('f_lead')}</label><select id="d_lead">${agentOpts(d.lead)}</select></div>
   <div class="field full"><label>${t('f_desc')}</label><textarea id="d_desc">${esc(d.desc)}</textarea></div>
  </div><div class="mfoot">${id?`<button class="btn" style="color:var(--bad)" onclick="delDrop('${id}')">${t('delete')}</button>`:''}<span class="sp"></span><button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn pri" onclick="saveDrop(${id?`'${id}'`:'null'})">${t('save')}</button></div>`);
}
function saveDrop(id){ const name=val('d_name').trim(); if(!name){toast(t('t_name_drop'));return;} const data={name,type:val('d_type'),date:val('d_date'),status:val('d_status'),lead:val('d_lead'),desc:val('d_desc')}; if(id) Object.assign(S.drops.find(x=>x.id===id),data); else S.drops.push({id:uid(),...data}); log(id?'lg_upd_drop':'lg_new_drop',{drop:name}); save(); closeModal(); render(); }
function delDrop(id){ if(!confirm(t('c_del_drop'))) return; S.drops=S.drops.filter(x=>x.id!==id); S.tasks.forEach(x=>{if(x.drop===id)x.drop='';}); save(); closeModal(); render(); }

function alertForm(id,pre){
  const a=id?S.alerts.find(x=>x.id===id):{title:'',by:TEAM_LEADERS.includes(S.as)?S.as:'oliver',sev:'High',state:'Open',note:'',...(pre||{})};
  openModal(`<h2>${id?t('f_edit_alert'):t('f_new_alert')}</h2><div class="fgrid">
   <div class="field full"><label>${t('f_what')}</label><input id="a_title" value="${esc(a.title)}"></div>
   <div class="field"><label>${t('f_by')}</label><select id="a_by">${agentOpts(a.by)}</select></div>
   <div class="field"><label>${t('f_sev')}</label><select id="a_sev">${SEVS.map(x=>`<option value="${x}" ${a.sev===x?'selected':''}>${t('sev_'+x)}</option>`).join('')}</select></div>
   <div class="field full"><label>${t('f_details')}</label><textarea id="a_note">${esc(a.note)}</textarea></div>
   <div class="full hint">${t('f_alert_route')}</div>
  </div><div class="mfoot">${id?`<button class="btn" style="color:var(--bad)" onclick="delAlert('${id}')">${t('delete')}</button>`:''}<span class="sp"></span><button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn pri" onclick="saveAlert(${id?`'${id}'`:'null'})">${id?t('save'):t('f_raise')}</button></div>`);
}
function saveAlert(id){ const title=val('a_title').trim(); if(!title){toast(t('t_describe'));return;} const data={title,by:val('a_by'),sev:val('a_sev'),note:val('a_note')}; if(id) Object.assign(S.alerts.find(x=>x.id===id),data); else { S.alerts.unshift({id:uid(),state:'Open',created:Date.now(),...data}); log('lg_alert',{name:A[data.by].name,title}); } save(); closeModal(); render(); if(!id) toast(t('t_alert_sent')); }
function delAlert(id){ if(!confirm(t('c_del_alert'))) return; S.alerts=S.alerts.filter(x=>x.id!==id); save(); closeModal(); render(); }
function alertFromTask(id){ const x=S.tasks.find(y=>y.id===id); const lead=chainOf(x.owner).find(y=>TEAM_LEADERS.includes(y))||(TEAM_LEADERS.includes(x.owner)?x.owner:'oliver'); closeModal(); alertForm(null,{title:t('blocked_prefix')+x.title,by:lead,note:x.desc}); }

/* ===================== DATA / SETTINGS ===================== */
function dataPanel(){
  openModal(`<h2>${t('d_title')}</h2>
   <p class="hint">${t('d_intro')}</p>
   <div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0"><button class="btn dark" onclick="exportData()">${t('d_export')}</button><label class="btn" style="cursor:pointer">${t('d_import')}<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></label><button class="btn" onclick="exportCSV()">${t('d_csv')}</button></div>
   <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="startEmpty()">${t('d_empty')}</button><button class="btn" onclick="loadSample()">${t('d_sample')}</button></div>
   <div class="mfoot"><button class="btn pri" onclick="closeModal()">${t('done_btn')}</button></div>`);
}
function startEmpty(){ if(!confirm(t('c_clear'))) return; S={...seed(),tasks:[],drops:[],alerts:[],activity:[{t:Date.now(),k:'lg_cleared',p:{}}],as:S.as,theme:S.theme,lang:LANG}; save(); closeModal(); render(); }
function loadSample(){ if(!confirm(t('c_sample'))) return; const th=S.theme; S=seed(); S.theme=th; S.lang=LANG; save(); closeModal(); render(); }
function download(name,text,type){ const b=new Blob([text],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
function exportData(){ download(`oyv-tracker-backup-${iso(new Date())}.json`,JSON.stringify(S,null,2),'application/json'); toast(t('t_backup')); }
function exportCSV(){ const h=t('csv_head'); const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"'; const rows=S.tasks.map(x=>[x.title,A[x.owner].name,roleOf(A[x.owner]),teamName(A[x.owner].team),SL(x.status),t('pr_'+x.prio),x.due,dropName(x.drop),x.apState,x.desc].map(q).join(',')); download(`oyv-tasks-${iso(new Date())}.csv`,'\ufeff'+[h.join(LANG==='it'?';':','),...rows.map(r=>LANG==='it'?r.replace(/","/g,'";"'):r)].join('\n'),'text/csv'); }
function importData(inp){ const f=inp.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!Array.isArray(d.tasks)||!Array.isArray(d.drops)) throw 0; d.alerts=d.alerts||[]; d.activity=d.activity||[]; d.as=A[d.as]?d.as:'founder'; d.lang=LANG; S=d; save(); closeModal(); applyTheme(); applyStatic(); render(); toast(t('t_imported')); }catch(e){ toast(t('t_bad_file')); } }; r.readAsText(f); }
function applyTheme(){ document.documentElement.dataset.theme=S.theme==='dark'?'dark':'light'; document.querySelector('meta[name=theme-color]').content=S.theme==='dark'?'#000000':'#FFFFFF'; }
function toggleTheme(){ S.theme=S.theme==='dark'?'light':'dark'; save(); applyTheme(); }
['themeBtn','themeBtn2'].forEach(i=>document.getElementById(i).onclick=toggleTheme);
['dataBtn','dataBtn2'].forEach(i=>document.getElementById(i).onclick=dataPanel);
document.getElementById('langBtn').onclick=()=>setLang(LANG==='en'?'it':'en');
document.getElementById('langBtn2').onclick=()=>setLang(LANG==='en'?'it':'en');
const asSel=document.getElementById('asSel'); asSel.onchange=()=>{S.as=asSel.value; save(); render();};
const asModal=()=>{ openModal(`<h2>${t('viewing_as')}</h2><select id="as2">${agentOpts(S.as)}</select><p class="hint">${t('as_hint')}</p><div class="mfoot"><button class="btn pri" onclick="S.as=val('as2');save();closeModal();render()">${t('switch')}</button></div>`); };
document.getElementById('asBtn2').onclick=asModal;
document.getElementById('pgSub').onclick=()=>{ if(window.innerWidth<=820) asModal(); };
applyTheme(); applyStatic(); render();

</script>
</body>
</html>
